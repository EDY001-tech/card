<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NFC Card — Your details, on a tap</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0f;color:#e8e8f0;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .wrap{max-width:480px}
  h1{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;margin-bottom:12px;letter-spacing:-0.5px}
  p{color:#9a9ab8;font-size:15px;margin-bottom:28px;line-height:1.5}
  a.cta{display:inline-block;background:#6c63ff;color:#fff;padding:13px 28px;border-radius:14px;text-decoration:none;font-weight:600;font-size:14px}
  a.cta:hover{background:#5a52e0}
</style>
</head>
<body>
  <div class="wrap">
    <h1>One tap. Your whole profile.</h1>
    <p>Create your profile, pick a card design, and link it to an NFC tag. Anyone who taps your card gets your details, CV, social links, and an AI assistant that can answer questions about you.</p>
    <a class="cta" href="auth.html">Create your card</a>
  </div>
</body>
</html>
