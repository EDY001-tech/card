<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign In — NFC Card</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0f;color:#e8e8f0;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:100%;max-width:380px;background:#16161f;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:32px}
  h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin-bottom:6px}
  p.sub{color:#8a8aa8;font-size:13px;margin-bottom:22px}
  .switch{display:flex;background:#111118;border-radius:12px;padding:4px;margin-bottom:20px}
  .switch button{flex:1;padding:9px;border:none;background:none;color:#8a8aa8;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600}
  .switch button.active{background:#6c63ff;color:#fff}
  label{display:block;font-size:11.5px;color:#8a8aa8;text-transform:uppercase;letter-spacing:0.5px;margin:14px 0 6px}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:#111118;color:#e8e8f0;font-size:14px}
  input:focus{outline:none;border-color:#6c63ff}
  button.submit{width:100%;margin-top:22px;padding:13px;border:none;border-radius:12px;background:#6c63ff;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
  button.submit:disabled{opacity:0.5;cursor:wait}
  .msg{margin-top:14px;font-size:12.5px;text-align:center;color:#8a8aa8}
  .msg.error{color:#ff6b6b}
  .msg.success{color:#3ddc84}
</style>
</head>
<body>
  <div class="box">
    <h1 id="title">Sign up</h1>
    <p class="sub" id="subtitle">Create your account, then build your card.</p>

    <div class="switch">
      <button id="tabSignup" class="active" onclick="setMode('signup')">Sign up</button>
      <button id="tabLogin" onclick="setMode('login')">Log in</button>
    </div>

    <form id="authForm">
      <label>Email</label>
      <input type="email" id="email" required placeholder="you@example.com"/>
      <label>Password</label>
      <input type="password" id="password" required minlength="6" placeholder="At least 6 characters"/>
      <button class="submit" type="submit" id="submitBtn">Sign up</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>

<script src="config.js"></script>
<script>
  let mode = 'signup';

  function setMode(m) {
    mode = m;
    document.getElementById('tabSignup').classList.toggle('active', m === 'signup');
    document.getElementById('tabLogin').classList.toggle('active', m === 'login');
    document.getElementById('title').textContent = m === 'signup' ? 'Sign up' : 'Log in';
    document.getElementById('subtitle').textContent = m === 'signup'
      ? 'Create your account, then build your card.'
      : 'Welcome back — let\'s get to your card.';
    document.getElementById('submitBtn').textContent = m === 'signup' ? 'Sign up' : 'Log in';
    document.getElementById('msg').textContent = '';
  }

  // If already logged in, skip straight to the dashboard
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'dashboard.html';
  });

  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    msg.className = 'msg';
    msg.textContent = 'Working on it…';

    try {
      if (mode === 'signup') {
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;
        msg.className = 'msg success';
        msg.textContent = 'Account created. Check your email if confirmation is required, then log in.';
        setMode('login');
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = 'dashboard.html';
      }
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
